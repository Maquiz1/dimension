{% extends "dimension/base.html" %}
{% block title %}Delete {{ document.title }}{% endblock %}
{% block content %}
  <section class="card" style="max-width:640px;">
    <h2 class="page-title">Delete “{{ document.title }}”?</h2>
    <p>The document and its file are removed for everyone. This cannot be undone, except by restoring a backup.</p>
    <form method="post" class="actions">
      {% csrf_token %}
      <button class="btn danger" type="submit">Delete</button>
      <a class="btn secondary" href="{% url 'resources:detail' document.pk %}">Cancel</a>
    </form>
  </section>
{% endblock %}
