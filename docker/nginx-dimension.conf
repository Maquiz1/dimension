# Host nginx site for https://dimension.tamris.org
#
#   cp docker/nginx-dimension.conf /etc/nginx/sites-available/dimension.tamris.org
#   ln -s /etc/nginx/sites-available/dimension.tamris.org /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d dimension.tamris.org      # adds the HTTPS server block and the HTTP -> HTTPS redirect

server {
    listen 80;
    server_name dimension.tamris.org;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 300s;
    }
}
